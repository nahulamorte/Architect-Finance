<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="720" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&amp;display=swap');
      .brand-title {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 58px;
        letter-spacing: -0.04em;
      }
      .word-architect {
        font-weight: 800;
        fill: #111827;
      }
      .word-finance {
        font-weight: 800;
        fill: #0052FF;
      }
      .dot-accent {
        fill: #0052FF;
      }
    </style>
  </defs>

  <text x="50%" y="98" text-anchor="middle" class="brand-title">
    <tspan class="word-architect">Architect </tspan><tspan class="word-finance">Finance</tspan><tspan class="dot-accent">.</tspan>
  </text>
</svg>