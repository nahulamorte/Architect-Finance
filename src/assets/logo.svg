<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#003EC7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8F9FA" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#003EC7" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean Canvas Background with rounded corners -->
  <rect width="960" height="240" rx="36" fill="url(#bgGrad)" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Logo Mark (A Monogram) scaled & aligned -->
  <g transform="translate(48, 30) scale(0.68)" filter="url(#subtleGlow)">
    <!-- Base squircle container for icon -->
    <rect width="260" height="260" rx="60" fill="#F0F4FF" stroke="#DBEAFE" stroke-width="2" />
    
    <!-- Geometric 'A' Pillars & Structure -->
    <g transform="translate(18, 16) scale(0.88)">
      <!-- Left Column / Angled leg of 'A' -->
      <path d="M 120 40 L 40 280 L 95 280 L 138 145 L 175 280 L 225 280 L 148 40 Z" fill="url(#blueGrad)" />
      <!-- Horizontal Crossbar / Bridge -->
      <rect x="75" y="210" width="125" height="32" rx="16" fill="#0052FF" />
      <!-- Dynamic Forward Accent / Growth pillar -->
      <path d="M 195 90 L 275 280 L 225 280 L 165 140 Z" fill="#003EC7" opacity="0.92" />
      <!-- Apex & Dynamic accents -->
      <circle cx="134" cy="40" r="18" fill="#0052FF" />
      <circle cx="230" cy="180" r="11" fill="#10B981" />
    </g>
  </g>

  <!-- Brand Typography: Architect Finance -->
  <g transform="translate(260, 0)">
    <!-- Main Wordmark -->
    <text x="0" y="128" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="800" letter-spacing="-0.035em" fill="#111827">
      Architect <tspan fill="#0052FF">Finance</tspan>
    </text>

    <!-- Subtitle / Brand Tagline -->
    <text x="4" y="168" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" letter-spacing="0.18em" fill="#6B7280">
      PRECISION WEALTH &amp; CASHFLOW
    </text>

    <!-- Decorative status dot & descriptor -->
    <circle cx="340" cy="162" r="3.5" fill="#10B981" />
    <text x="354" y="168" font-family="'Manrope', sans-serif" font-size="15" font-weight="700" letter-spacing="0.08em" fill="#003EC7">
      HOMEBANKING
    </text>
  </g>
</svg>
